<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found &middot; Juke</title>
  <meta name="robots" content="noindex">

  <!-- **Every path here is absolute, and that is the whole trick of this file.**
       Cloudflare Pages serves 404.html for a miss at any depth, so a request to
       /a/b/c gets this page rendered *at that address* — a relative "style.css"
       would then resolve to /a/b/style.css and 404 as well, leaving an unstyled
       page as the answer to a missing one. -->
  <script src="/theme.js?v=202609081450"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Same ?v= as index.html, and bumped with it by the nightly workflow,
       which now lists this file alongside the other two. -->
  <link rel="stylesheet" href="/style.css?v=202609081450">

  <!-- The SVG first, because that is what a modern tab actually draws; the
       PNGs and the .ico behind it for the ones that cannot. All absolute, per
       the rule at the top of this file. -->
  <link rel="icon" href="/juke-icon-tile.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/juke-icon-tile-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/juke-icon-tile-16.png">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <style>
    /* Only tokens the stylesheet already defines in both themes. A literal
       here would be invisible under one of them. */
    .nf {
      min-height: 78vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; text-align: center;
      padding: 40px 20px 64px;
      max-width: 560px; margin: 0 auto;
    }
    .nf-code {
      font-family: var(--font-display);
      font-size: var(--fs-3xl); font-weight: 700; line-height: 1;
      color: var(--teal-ink);
      letter-spacing: -.02em;
    }
    .nf h1 {
      font-family: var(--font-display);
      font-size: var(--fs-xl); font-weight: 700; line-height: 1.2;
      margin: 0; color: var(--ink);
      text-wrap: balance;
    }
    .nf p {
      margin: 0; font-size: var(--fs-base); line-height: 1.6;
      color: var(--ink-mid); max-width: 44ch;
    }
    .nf-acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
    .nf-acts a {
      font-size: var(--fs-base); font-weight: 600;
      padding: 11px 20px; border-radius: var(--r-pill);
      text-decoration: none; display: inline-block;
    }
    .nf-go { background: var(--teal-cta); color: var(--teal-cta-ink); }
    .nf-go:hover { background: var(--teal-cta-hover); }
    .nf-alt { color: var(--link); border: 1px solid var(--line); }
    .nf-alt:hover { background: var(--fill); }
    .nf-acts a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    /* 564 by 352 in the artwork, so height is derived from width and never
       chosen: 86 / 1.602 = 54, which is the height the mark this replaces
       had. The old inline shape took its two colours from --mark-ink and
       --teal, so it reversed with the theme on its own; an <img> cannot, and
       the mark has a file per ground rather than one file you recolour. Hence
       two of them and a swap, rather than one that is invisible under one
       theme. Dark is the default because :root is. */
    .nf-mark { width: 86px; height: 54px; }
    /* No dark/light pair any more: design package 02's mark carries its own
       negatives (#1A222D, not a canvas colour) and reads on either ground, so
       one <img> replaces the two that used to swap on [data-theme]. */
  </style>
</head>
<body>

  <main class="nf">
    <!-- Referenced rather than inlined, which reverses the note that used to
         sit here. That note argued the mark had to be inline because this page
         renders after something else has already 404'd — but it was drawn with
         var(--mark-ink) and var(--teal), so it depended on style.css anyway and
         the independence was never real. What it did buy was a private copy of
         the logo, which is how this page ended up two brand generations behind
         the app without anything reporting it.

         Absolute paths, per the rule at the top: this page is served at
         whatever address missed. -->
    <img class="nf-mark" src="/juke-shark-mark.svg" width="86" height="54" alt="" aria-hidden="true">

    <span class="nf-code">404</span>
    <h1>There is nothing at this address</h1>
    <p>The link may be old, or mistyped. Nothing has gone wrong with your draft &mdash;
      a saved one is still where you left it.</p>

    <div class="nf-acts">
      <a class="nf-go" href="/">Go to Juke</a>
      <!-- #/drafts, not #/draft. The latter is the retired route: applyRoute()
           still redirects it, so this link "worked", but it worked by landing
           on a redirect written for old bookmarks rather than by pointing at
           the room. The one page whose entire job is recovering from a bad
           address should not itself carry one. -->
      <a class="nf-alt" href="/#/drafts">Open the Draft Room</a>
    </div>
  </main>

</body>
</html>
