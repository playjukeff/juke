name: Update player data

# Two ways this runs:
#   schedule          — every morning at 11:00 UTC (6am Central)
#   workflow_dispatch — a "Run workflow" button on the Actions tab,
#                       which is how you test it without waiting a day
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

# The job commits back to this repository, so it needs write access.
# Without this line the push at the end fails with a 403.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild players.js
        run: python scripts/build_players.py
        env:
          # The source-id crosswalk, and nothing else here, needs a key. Without
          # it build_players.py skips that step and says so, and the rebuild is
          # otherwise identical -- which is exactly what makes this dangerous to
          # leave out. This job regenerates stats.js from scratch every morning,
          # so a missing key does not fail the run: it quietly drops every `x`
          # id that a keyed run had put there, and player news stops working
          # overnight with nothing in the log that looks like a fault.
          #
          # Set it once: Settings -> Secrets and variables -> Actions -> New
          # repository secret, named TANK01_KEY. An unset secret arrives as an
          # empty string, which is the same as no key, so this line is safe to
          # merge before the secret exists.
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          # The Prospect Room's two blocks: record["pr"] (a rookie's draft
          # position and final college season) and COLLEGE_BOARD (players still
          # in college, who are NOT on the draft board and never will be until
          # somebody drafts them).
          #
          # Optional exactly as TANK01_KEY is -- no key, no calls, no blocks,
          # and an otherwise identical rebuild. It differs from Tank01 in how
          # LOUD the failure is, and that is worth knowing: a missing Tank01
          # key silently drops ids nobody looks at, where a missing CFBD key
          # empties a room somebody opened on purpose. The run says which it
          # is, and unmatched.txt carries the detail.
          #
          # It is also the only feed here that costs real bandwidth: about
          # 28 MB and 15s, because /stats/player/season is the whole college
          # season (23.6 MB) and the FBS roster is another 4.5. One call each
          # rather than one per player, and the season serves both blocks.
          #
          # Both years derive from STAT_SEASONS in build_players.py, so the
          # one constant somebody bumps each January moves the draft class and
          # the college season with it. Nothing here needs editing annually.
          CFBD_KEY: ${{ secrets.CFBD_KEY }}

      - name: Guard the frozen baseline
        # data/baselines/2026/preseason/ is a one-shot, hand-frozen snapshot
        # (scripts/freeze_baseline.mjs) that this nightly rebuild must never
        # touch -- see its own README.md for why. Nothing above stages that
        # path (the commit step below adds three named files, never a
        # wildcard), so this should always be a no-op; it exists so a future
        # edit to build_players.py that starts writing there fails loudly in
        # CI instead of silently invalidating the baseline.
        run: |
          if [ -n "$(git status --porcelain data/baselines)" ]; then
            echo "::error::scripts/build_players.py touched data/baselines/ -- the frozen baseline must never be regenerated. See data/baselines/2026/preseason/README.md."
            git status --porcelain data/baselines
            exit 1
          fi

      - name: Commit if anything changed
        run: |
          git config user.name  "alpine-draft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.js stats.js unmatched.txt

          # --quiet exits non-zero when there ARE changes, so this is the
          # early exit on a day when nothing moved.
          if git diff --staged --quiet; then
            echo "No change in the feeds today; nothing to commit."
            exit 0
          fi

          # New data behind an unchanged address is data nobody sees, so
          # bumping the stamp is what actually ships the rebuild — see the
          # note beside ?v= in web/index.html. Down to the minute, because
          # this workflow also has a Run button and can fire twice in a day.
          #
          # 404.html is in this list for the same reason the other two are: it
          # loads style.css and theme.js by the same versioned address. It is
          # the easiest one to forget, because nobody visits it on purpose.
          #
          # docs/privacy.html and docs/terms.html join it as of 4 September
          # 2026, having been missing since they were written. Both load
          # style.css, theme.js and back-to-top.js by a stamped address and
          # neither was ever bumped, so all three sat frozen at 202608222306
          # while the rest of the site moved — a returning visitor got August's
          # stylesheet on a page whose HTML had changed under it, which is this
          # project's own "a rebuild nobody sees" failure with a two-week lead.
          # Found by the Gabarito swap, where those two pages would have
          # requested the new face and styled it with the old --font-display.
          STAMP=$(date -u +%Y%m%d%H%M)
          STAMPED="web/index.html 404.html docs/draft-room-how-it-works.html docs/privacy.html docs/terms.html"
          sed -i -E "s/\?v=[0-9A-Za-z._-]+/?v=$STAMP/g" $STAMPED
          git add $STAMPED

          git commit -m "Update player data ($(date -u +%Y-%m-%d))"
          git push
