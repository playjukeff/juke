name: Tests

# The suites that are cheap enough to run on every change: standard-library
# Python and one plain-node module test, no network, no pip install, no
# wrangler, a few seconds each.
#
# The Playwright suite is deliberately NOT here. It is forty-seven tests, about
# fifteen minutes, and it needs a wrangler dev running a Durable Object beside
# a static server -- worth running before a deploy, and too heavy to sit in
# front of every push. So this is a floor rather than the whole gate: green
# here means the snake maths and the source-id join still hold, and it does not
# mean the app works. Anything touching the browser still gets `npx playwright
# test` run by hand.
on:
  pull_request:
  push:
    branches: [main]

# Read-only. This job checks; the only workflow that writes is the nightly
# rebuild, and it says so in its own permissions block.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Nothing here pushes, so the checkout does not need to leave a
          # credential behind in .git/config for the rest of the job.
          # update-players, update_data and archive-weekly-actuals DO push
          # and deliberately keep theirs.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # test_engine.py evaluates draft-engine.js and room.js in a real
      # JavaScript host -- that is the entire point of it, since the claim
      # being tested is that a server and every client reach the same verdict.
      # It looks for node, deno or bun on PATH and says so plainly if none is
      # there, which on a bare runner would read as the engine being broken.
      # ubuntu-latest ships node, so this pin is about knowing which one ran
      # rather than about making it available.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Engine and room rules
        run: python scripts/test_engine.py

      - name: Source-id crosswalk
        run: python scripts/test_crosswalk.py

      # The one check that is about DEPLOYING rather than about behaviour:
      # the worker ships separately from the site, so it meets databases
      # that are one or two migrations behind it. listLeagues() has a
      # fallback ladder for exactly that, and the ladder was silently
      # broken by the change that trusted it. sqlite3 is what D1 is, so
      # this needs no account and no network.
      - name: Schema fallback ladder
        run: python scripts/test_schema_ladder.py

      # The decision ledger's own SQL, for the reason test-auth.mjs cannot
      # cover it: every /me/decisions assertion there is about being signed
      # OUT, and the statement that matters most -- the DO UPDATE's WHERE,
      # which stops one account overwriting another's decision by reusing an
      # id it guessed -- only runs for somebody signed in. That needs a token
      # Clerk actually signed, which nothing offline can produce. So this
      # reads the shipped SQL out of store.js and runs it against sqlite,
      # exactly as the ladder above does, and with the same reasoning: a copy
      # of the statement here would pass while the real one was broken.
      - name: Decision ledger SQL
        run: python scripts/test_decisions.py

      # The other thing sqlite3 can answer without an account: whether a
      # write is scoped to the account that owns the row. draft_history.id
      # is minted client-side and arrives in the request body, so a conflict
      # on it is not necessarily the caller's own row -- and a cross-account
      # overwrite renders, contrasts and answers 200, which is to say nothing
      # this project runs could see it. Reads the real statement out of
      # store.js for the reason the ladder above does.
      - name: Locker write ownership
        run: python scripts/test_history_ownership.py

      # sleeper.js is a plain module and its real work is turning four
      # upstream responses into one object, so this drives it against a
      # local stub with no network and no wrangler -- which is the only way
      # to ask it for a 500, a truncated body or forty-one rosters. It
      # belongs here for the same reason the two above do: seconds, and no
      # moving parts to be flaky.
      - name: Sleeper parse and join
        run: node worker/test-sleeper.mjs

      # The connected-league state machine. It is here rather than in the
      # browser suite for a reason that is not speed: every surface that can
      # show its failure sits inside Clerk's <SignedIn>, and a build with no
      # publishable key renders the signed-out fallback instead -- confirmed
      # rather than assumed, by a Playwright spec against the real page that
      # found no card at all. CLAUDE.md records that as the widest gap in
      # this area's coverage.
      #
      # web/src/lib/leagueStore.js imports nothing, which is what lets this
      # run with no npm install -- like every other step in this job.
      - name: Connected-league state machine
        run: node scripts/test_league_state.mjs

      # The decision-ledger store, for the reason the one above exists: the
      # surfaces that render it are all inside Clerk's <SignedIn>, which a
      # keyless build never draws, so the machine is tested where it
      # actually is. web/src/lib/decisionStore.js imports nothing, which is
      # what lets this run with no npm install like every other step here.
      - name: Decision-ledger state machine
        run: node scripts/test_decision_state.mjs

      # The Waiver Room's arithmetic — who is available and what a claim is
      # worth. Here rather than in the browser suite for the reason the two
      # above are: the room only renders inside Clerk's <SignedIn>, which a
      # keyless build never draws. This is the module that decides what a
      # manager is told to claim, so "only checkable by looking at a screen
      # nobody can reach" was not an acceptable place for it to live.
      - name: Waiver board
        run: node scripts/test_waiver_board.mjs
